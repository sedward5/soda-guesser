name: Puzzle issue
description: Report a problem with a specific Pop Quiz puzzle.
title: "[Puzzle] "
labels:
  - puzzle
  - data

body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Pop Quiz!

        This form is for problems with a specific puzzle, especially
        incorrect, missing, or broken images.

        If you arrived here from the game's **Report a Puzzle Issue**
        button, some information may already be filled in.

  - type: input
    id: puzzle-id
    attributes:
      label: Puzzle ID
      description: The canonical Pop Quiz puzzle ID.
      placeholder: "wp-10243"
    validations:
      required: true

  - type: input
    id: source-url
    attributes:
      label: VGSM source page
      description: The Video Game Soda Machine Project page associated with this puzzle.
      placeholder: "https://vgsmproject.com/..."
    validations:
      required: true

  - type: input
    id: game-title
    attributes:
      label: Game title shown by Pop Quiz
      description: The title currently displayed by the game.
      placeholder: "Epic Skater 2"

  - type: dropdown
    id: problem
    attributes:
      label: What is wrong?
      options:
        - Wrong image
        - Broken image
        - Missing image
        - Wrong game/title
        - Incorrect source page
        - Duplicate puzzle
        - Other
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: Tell us what you expected to see and what you actually saw.
      placeholder: |
        The image appears to be from a different game.
        I believe it should show...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that might help us investigate.
      placeholder: |
        For example:
        - Where the image appears on the VGSM page
        - A link to the correct image
        - Other clues about the game

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I have checked that this is a problem with this specific puzzle.
          required: true
        - label: I have included enough information for someone to identify the source record.
          required: true
